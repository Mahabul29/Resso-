name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo has no gradlew / gradle-wrapper.jar, so install the Gradle
      # version from gradle-wrapper.properties (9.3.1) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects ./debug.keystore. Use the committed one so the SHA-1
      # stays the same on every build (needed for Google Sign-In). Only create a
      # throwaway one if it is missing.
      - name: Create debug keystore
        run: |
          if [ -f debug.keystore ]; then echo "Using committed debug.keystore"; exit 0; fi
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Optional: your Firebase config (Settings > Secrets > GOOGLE_SERVICES_JSON).
      # Without it the app still builds, but Firebase (comments, login) won't work.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using google-services.json committed in the repo"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json added"
          else
            echo "No GOOGLE_SERVICES_JSON secret set, building without it"
          fi

      # Optional: .env for keys like GEMINI_API_KEY (secret name: DOT_ENV).
      - name: Add .env
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then echo "$DOT_ENV" > .env; fi

      - name: Build debug APK
        if: github.event.inputs.build_type != 'release'
        run: gradle assembleDebug --stacktrace

      # Release needs these repo secrets:
      #   KEYSTORE_BASE64  (your .jks file encoded with base64)
      #   STORE_PASSWORD, KEY_PASSWORD   (key alias must be "upload")
      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
          gradle assembleRelease --stacktrace

      # Artifact upload is optional (GitHub artifact storage can fill up), so never fail the run.
      - name: Upload APK (artifact)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Resso-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 1

      # Publishes the APK to a permanent "latest" release. Releases don't use artifact
      # storage and give a fixed download link for the README.
      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK" Resso.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Resso.apk \
            --title "Resso (latest build)" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}. Download Resso.apk below." \
            --target "$GITHUB_SHA"


            
